<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b111e"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="500" height="320" rx="12" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Title Badge -->
  <rect x="20" y="16" width="150" height="26" rx="6" fill="#1E293B" />
  <text x="30" y="34" fill="#FFB703" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold">騎馬立ち • KIBA DACHI</text>

  <!-- Floor Grid -->
  <line x1="40" y1="260" x2="460" y2="260" stroke="#334155" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Parallel Feet Footprints -->
  <!-- Left Foot -->
  <g transform="translate(160, 245)">
    <rect x="-13" y="-27" width="26" height="54" rx="11" fill="#3B82F6" opacity="0.9" stroke="#60A5FA" stroke-width="1.5"/>
    <text x="0" y="3" fill="#FFF" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">50%</text>
    <line x1="0" y1="-27" x2="0" y2="-40" stroke="#60A5FA" stroke-width="2"/>
    <path d="M 0,-44 L -4,-38 L 4,-38 Z" fill="#60A5FA"/>
    <text x="0" y="-48" fill="#93C5FD" font-size="9" font-family="sans-serif" text-anchor="middle">Pé Paralelo</text>
  </g>

  <!-- Right Foot -->
  <g transform="translate(340, 245)">
    <rect x="-13" y="-27" width="26" height="54" rx="11" fill="#3B82F6" opacity="0.9" stroke="#60A5FA" stroke-width="1.5"/>
    <text x="0" y="3" fill="#FFF" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">50%</text>
    <line x1="0" y1="-27" x2="0" y2="-40" stroke="#60A5FA" stroke-width="2"/>
    <path d="M 0,-44 L -4,-38 L 4,-38 Z" fill="#60A5FA"/>
    <text x="0" y="-48" fill="#93C5FD" font-size="9" font-family="sans-serif" text-anchor="middle">Pé Paralelo</text>
  </g>

  <!-- Karateka Frontal View in Kiba Dachi -->
  <!-- Head -->
  <circle cx="250" cy="85" r="18" fill="#F1F5F9" stroke="#FFB703" stroke-width="2"/>
  <circle cx="244" cy="83" r="2.5" fill="#0F172A"/>
  <circle cx="256" cy="83" r="2.5" fill="#0F172A"/>

  <!-- Torso & Tanden (Centered, Pelvis Tucked) -->
  <line x1="250" y1="103" x2="250" y2="175" stroke="#F1F5F9" stroke-width="7" stroke-linecap="round"/>
  <circle cx="250" cy="165" r="8" fill="#FFB703" filter="url(#glow)"/>
  <text x="250" y="152" fill="#FFB703" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">Centro Exato (50/50)</text>

  <!-- Left Leg (Knee pushed outwards) -->
  <polyline points="250,175 175,205 160,250" fill="none" stroke="#60A5FA" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="175" cy="205" r="6" fill="#3B82F6"/>

  <!-- Right Leg (Knee pushed outwards) -->
  <polyline points="250,175 325,205 340,250" fill="none" stroke="#60A5FA" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="325" cy="205" r="6" fill="#3B82F6"/>

  <!-- Knee Push Outward Arrows -->
  <path d="M 160,205 L 140,205 M 140,205 L 146,200 M 140,205 L 146,210" stroke="#EAB308" stroke-width="2" fill="none"/>
  <path d="M 340,205 L 360,205 M 360,205 L 354,200 M 360,205 L 354,210" stroke="#EAB308" stroke-width="2" fill="none"/>
  <text x="250" y="222" fill="#EAB308" font-size="9" font-family="sans-serif" text-anchor="middle">Joelhes pressionam para fora</text>

  <!-- Guard Arms -->
  <polyline points="250,120 205,140 190,150" fill="none" stroke="#F1F5F9" stroke-width="5" stroke-linecap="round"/>
  <polyline points="250,120 295,140 310,150" fill="none" stroke="#F1F5F9" stroke-width="5" stroke-linecap="round"/>

  <!-- Distance Measurement -->
  <line x1="160" y1="295" x2="340" y2="295" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="160" y1="290" x2="160" y2="300" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="340" y1="290" x2="340" y2="300" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="250" y="310" fill="#E2E8F0" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">Base do Cavaleiro (Cavalo de Ferro)</text>
</svg>
