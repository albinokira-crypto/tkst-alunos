<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b111e"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="500" height="320" rx="12" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Title Badge -->
  <rect x="20" y="16" width="160" height="26" rx="6" fill="#1E293B" />
  <text x="30" y="34" fill="#FFB703" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold">前蹴り • MAE GERI</text>

  <!-- Floor Grid -->
  <line x1="40" y1="260" x2="460" y2="260" stroke="#334155" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Karateka Executing Mae Geri Front Kick -->
  <!-- Head -->
  <circle cx="280" cy="85" r="18" fill="#F1F5F9" stroke="#FFB703" stroke-width="2"/>
  <circle cx="272" cy="83" r="2.5" fill="#0F172A"/>

  <!-- Torso (Upright, not leaning backwards) -->
  <line x1="280" y1="103" x2="278" y2="175" stroke="#F1F5F9" stroke-width="6" stroke-linecap="round"/>
  <circle cx="278" cy="165" r="7" fill="#FFB703" filter="url(#glow)"/>

  <!-- Guard Arms (Compact, protecting center) -->
  <polyline points="280,120 250,135 240,125" fill="none" stroke="#F1F5F9" stroke-width="5" stroke-linecap="round"/>
  <polyline points="280,120 295,135 285,145" fill="none" stroke="#F1F5F9" stroke-width="5" stroke-linecap="round"/>

  <!-- Supporting Leg (Planted firmly) -->
  <polyline points="278,175 282,215 285,255" fill="none" stroke="#3B82F6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="285" cy="255" r="8" fill="#1D4ED8"/>
  <text x="300" y="255" fill="#93C5FD" font-size="9" font-family="sans-serif">Perna de Apoio</text>

  <!-- Kicking Leg (Full Extension to Chudan/Jodan) -->
  <!-- Knee Chamber / Pivot Point -->
  <circle cx="215" cy="150" r="6" fill="#EAB308"/>
  <!-- Leg extending to impact point -->
  <line x1="278" y1="175" x2="215" y2="150" stroke="#EF4444" stroke-width="7" stroke-linecap="round"/>
  <line x1="215" y1="150" x2="90" y2="135" stroke="#EF4444" stroke-width="7" stroke-linecap="round"/>
  
  <!-- Foot Shape (Koshi / Ball of foot impact) -->
  <circle cx="90" cy="135" r="9" fill="#DC2626" stroke="#FFB703" stroke-width="2" filter="url(#glow)"/>
  <!-- Impact Starburst -->
  <path d="M 70,135 L 80,130 M 70,135 L 80,140 M 75,120 L 82,128 M 75,150 L 82,142" stroke="#FFB703" stroke-width="2"/>
  <text x="90" y="115" fill="#F87171" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">KOSHI (Almofada)</text>

  <!-- Snap and Retraction Arc (Hikiashi) -->
  <path d="M 90,145 Q 160,185 215,155" fill="none" stroke="#EAB308" stroke-width="2" stroke-dasharray="3,3"/>
  <polygon points="215,155 204,158 208,168" fill="#EAB308"/>
  <text x="160" y="195" fill="#EAB308" font-size="9" font-family="sans-serif" text-anchor="middle">Hikiashi (Recolhimento Rápido)</text>

  <text x="250" y="305" fill="#E2E8F0" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">Chute Frontal com Elevação e Extensão de Joelho</text>
</svg>
