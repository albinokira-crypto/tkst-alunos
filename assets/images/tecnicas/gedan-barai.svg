<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b111e"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="500" height="320" rx="12" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Title Badge -->
  <rect x="20" y="16" width="160" height="26" rx="6" fill="#1E293B" />
  <text x="30" y="34" fill="#FFB703" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold">下段払い • GEDAN BARAI</text>

  <!-- Floor Grid -->
  <line x1="40" y1="260" x2="460" y2="260" stroke="#334155" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Karateka in Zenkutsu Dachi executing Gedan Barai -->
  <!-- Head (Profile/Semi-Profile) -->
  <circle cx="215" cy="85" r="18" fill="#F1F5F9" stroke="#FFB703" stroke-width="2"/>
  <circle cx="207" cy="83" r="2.5" fill="#0F172A"/>

  <!-- Torso in Hanmi (45 degrees semi-profile) -->
  <line x1="215" y1="103" x2="218" y2="175" stroke="#F1F5F9" stroke-width="6" stroke-linecap="round"/>
  <circle cx="217" cy="165" r="7" fill="#FFB703" filter="url(#glow)"/>

  <!-- Blocking Arc: From Opposite Ear Downward Across Thigh -->
  <!-- Preparatory Point near ear -->
  <circle cx="235" cy="80" r="5" fill="#94A3B8" stroke-dasharray="2,2"/>
  <text x="250" y="82" fill="#94A3B8" font-size="9" font-family="sans-serif">Início (Orelha Oposta)</text>

  <!-- Downward Sweeping Arc -->
  <path d="M 235,85 Q 200,140 100,195" fill="none" stroke="#EAB308" stroke-width="2.5" stroke-dasharray="4,4"/>
  <polygon points="90,198 102,190 104,202" fill="#EAB308"/>

  <!-- Blocking Arm (Swept downward over front knee) -->
  <line x1="215" y1="120" x2="105" y2="195" stroke="#3B82F6" stroke-width="7" stroke-linecap="round"/>
  <circle cx="105" cy="195" r="8" fill="#2563EB" filter="url(#glow)"/>
  <text x="80" y="215" fill="#93C5FD" font-size="10" font-weight="bold" font-family="sans-serif">Varredura Baixa</text>

  <!-- Hikite (Opposite arm at hip) -->
  <polyline points="215,120 250,135 230,155" fill="none" stroke="#EF4444" stroke-width="6" stroke-linecap="round"/>
  <circle cx="230" cy="155" r="6" fill="#DC2626"/>
  <text x="255" y="158" fill="#FCA5A5" font-size="9" font-family="sans-serif">Hikite Firme</text>

  <!-- Front Leg (Zenkutsu) -->
  <polyline points="218,175 160,205 130,250" fill="none" stroke="#60A5FA" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Rear Leg (Zenkutsu) -->
  <polyline points="218,175 285,215 340,250" fill="none" stroke="#94A3B8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Clearance distance from knee indicator -->
  <line x1="105" y1="195" x2="160" y2="205" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="135" y="185" fill="#CBD5E1" font-size="8" font-family="sans-serif" text-anchor="middle">~2 punhos do joelho</text>
  
  <text x="250" y="305" fill="#E2E8F0" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">Defesa Baixa em Hanmi (Semi-perfil)</text>
</svg>
