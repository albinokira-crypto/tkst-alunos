<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b111e"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="500" height="320" rx="12" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Title Badge -->
  <rect x="20" y="16" width="150" height="26" rx="6" fill="#1E293B" />
  <text x="30" y="34" fill="#FFB703" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold">追い突き • OI TSUKI</text>

  <!-- Floor Grid -->
  <line x1="40" y1="260" x2="460" y2="260" stroke="#334155" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Stepping Forward Dynamic Arrow -->
  <path d="M 330,285 Q 230,295 130,265" fill="none" stroke="#EAB308" stroke-width="2.5" stroke-dasharray="4,4"/>
  <polygon points="120,262 132,258 130,270" fill="#EAB308"/>
  <text x="230" y="305" fill="#EAB308" font-size="10" font-family="sans-serif" text-anchor="middle">Avanço em Linha Reta (Zenkutsu)</text>

  <!-- Feet -->
  <g transform="translate(130, 245)">
    <rect x="-12" y="-26" width="24" height="48" rx="10" fill="#3B82F6" opacity="0.9" stroke="#60A5FA" stroke-width="1.5"/>
    <text x="0" y="3" fill="#FFF" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Migi</text>
  </g>
  <g transform="translate(340, 245) rotate(45)">
    <rect x="-11" y="-24" width="22" height="44" rx="9" fill="#94A3B8" opacity="0.7"/>
  </g>

  <!-- Karateka Executing Oi Tsuki -->
  <!-- Head -->
  <circle cx="210" cy="85" r="18" fill="#F1F5F9" stroke="#FFB703" stroke-width="2"/>
  <circle cx="202" cy="83" r="2.5" fill="#0F172A"/> <!-- Eye looking left -->

  <!-- Torso in Shomen (Frontal Drive) -->
  <line x1="210" y1="103" x2="212" y2="175" stroke="#F1F5F9" stroke-width="6" stroke-linecap="round"/>
  <circle cx="211" cy="165" r="7" fill="#FFB703" filter="url(#glow)"/>

  <!-- Punching Arm (Same side as front leg - Right Arm extending left) -->
  <!-- Punch Vector Line -->
  <line x1="210" y1="120" x2="65" y2="120" stroke="#EF4444" stroke-width="7" stroke-linecap="round"/>
  <circle cx="65" cy="120" r="9" fill="#DC2626" stroke="#EF4444" stroke-width="2" filter="url(#glow)"/>
  <!-- Impact Burst -->
  <path d="M 45,120 L 55,115 M 45,120 L 55,125 M 50,105 L 56,114 M 50,135 L 56,126" stroke="#FFB703" stroke-width="2"/>
  <text x="65" y="100" fill="#F87171" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">KIME (Impacto)</text>

  <!-- Hikite Arm (Left arm pulled tightly to hip) -->
  <polyline points="210,120 245,135 225,155" fill="none" stroke="#3B82F6" stroke-width="6" stroke-linecap="round"/>
  <circle cx="225" cy="155" r="7" fill="#2563EB"/>
  <text x="260" y="158" fill="#93C5FD" font-size="9" font-family="sans-serif">Hikite no Quadril</text>

  <!-- Front Leg (Right leg forward) -->
  <polyline points="212,175 160,205 130,250" fill="none" stroke="#60A5FA" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Rear Leg (Left leg driving) -->
  <polyline points="212,175 280,215 340,250" fill="none" stroke="#94A3B8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  
  <text x="210" y="55" fill="#E2E8F0" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">Soco Avançado (Mesmo lado da perna)</text>
</svg>
