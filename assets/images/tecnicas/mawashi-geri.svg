<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b111e"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="500" height="320" rx="12" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Title Badge -->
  <rect x="20" y="16" width="170" height="26" rx="6" fill="#1E293B" />
  <text x="30" y="34" fill="#FFB703" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold">回し蹴り • MAWASHI GERI</text>

  <!-- Floor Grid -->
  <line x1="40" y1="260" x2="460" y2="260" stroke="#334155" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Karateka Executing Mawashi Geri Roundhouse Kick -->
  <!-- Head (Turned to target) -->
  <circle cx="270" cy="85" r="18" fill="#F1F5F9" stroke="#FFB703" stroke-width="2"/>
  <circle cx="262" cy="83" r="2.5" fill="#0F172A"/>

  <!-- Torso (Rotated with hip torque) -->
  <line x1="270" y1="103" x2="270" y2="175" stroke="#F1F5F9" stroke-width="6" stroke-linecap="round"/>
  <circle cx="270" cy="165" r="7" fill="#FFB703" filter="url(#glow)"/>

  <!-- Circular Hip Rotation Path -->
  <path d="M 330,175 A 40,30 0 1,0 230,150" fill="none" stroke="#EAB308" stroke-width="2.5" stroke-dasharray="4,4"/>
  <polygon points="230,150 238,142 242,152" fill="#EAB308"/>
  <text x="310" y="145" fill="#EAB308" font-size="9" font-family="sans-serif">Giro do Quadril (90°-180°)</text>

  <!-- Supporting Leg (Pivoted on ball of foot) -->
  <polyline points="270,175 275,215 280,255" fill="none" stroke="#3B82F6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="280" cy="255" r="8" fill="#1D4ED8"/>

  <!-- Kicking Leg (Horizontal Arc to Target) -->
  <polyline points="270,175 190,145 95,120" fill="none" stroke="#EF4444" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Foot Impact (Haisoku / Instep or Koshi) -->
  <circle cx="95" cy="120" r="9" fill="#DC2626" stroke="#FFB703" stroke-width="2" filter="url(#glow)"/>
  <!-- Impact Starburst -->
  <path d="M 75,120 L 85,115 M 75,120 L 85,125 M 80,105 L 87,113 M 80,135 L 87,127" stroke="#FFB703" stroke-width="2"/>
  <text x="95" y="100" fill="#F87171" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">HAISOKU / KOSHI</text>

  <!-- Guard Arms -->
  <polyline points="270,120 240,135 220,125" fill="none" stroke="#F1F5F9" stroke-width="5" stroke-linecap="round"/>
  <polyline points="270,120 295,130 305,145" fill="none" stroke="#F1F5F9" stroke-width="5" stroke-linecap="round"/>

  <text x="250" y="305" fill="#E2E8F0" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">Chute Semicircular com Pivô no Pé de Apoio</text>
</svg>
