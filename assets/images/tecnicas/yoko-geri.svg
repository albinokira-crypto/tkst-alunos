<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b111e"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="500" height="320" rx="12" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Title Badge -->
  <rect x="20" y="16" width="180" height="26" rx="6" fill="#1E293B" />
  <text x="30" y="34" fill="#FFB703" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold">横蹴り込み • YOKO GERI</text>

  <!-- Floor Grid -->
  <line x1="40" y1="260" x2="460" y2="260" stroke="#334155" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Karateka Executing Yoko Geri Kekomi Side Thrust Kick -->
  <!-- Head (Looking along the kick line) -->
  <circle cx="290" cy="110" r="18" fill="#F1F5F9" stroke="#FFB703" stroke-width="2"/>
  <circle cx="282" cy="108" r="2.5" fill="#0F172A"/>

  <!-- Torso (Slightly tilted, aligned with hip thrust) -->
  <line x1="290" y1="128" x2="280" y2="185" stroke="#F1F5F9" stroke-width="6" stroke-linecap="round"/>
  <circle cx="280" cy="180" r="7" fill="#FFB703" filter="url(#glow)"/>

  <!-- Supporting Leg (Pivoted 180° away from target) -->
  <polyline points="280,185 295,220 300,255" fill="none" stroke="#3B82F6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="300" cy="255" r="8" fill="#1D4ED8"/>
  <text x="315" y="255" fill="#93C5FD" font-size="9" font-family="sans-serif">Pé Apoio 180°</text>

  <!-- Kicking Leg (Thrust in straight horizontal line) -->
  <polyline points="280,185 195,160 85,150" fill="none" stroke="#EF4444" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Foot Blade (Sokuto - Outer Knife Edge of foot) -->
  <g transform="translate(85, 150)">
    <rect x="-12" y="-16" width="24" height="32" rx="6" fill="#DC2626" stroke="#FFB703" stroke-width="2" filter="url(#glow)"/>
    <text x="0" y="3" fill="#FFF" font-size="8" font-weight="bold" font-family="sans-serif" text-anchor="middle">SOKUTO</text>
  </g>
  <!-- Thrust Power Vector -->
  <line x1="280" y1="150" x2="60" y2="150" stroke="#FFB703" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="85" y="125" fill="#F87171" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">Faca do Pé (Sokuto)</text>

  <!-- Guard Arms -->
  <polyline points="290,135 250,145 235,140" fill="none" stroke="#F1F5F9" stroke-width="5" stroke-linecap="round"/>
  <polyline points="290,135 315,145 320,160" fill="none" stroke="#F1F5F9" stroke-width="5" stroke-linecap="round"/>

  <text x="250" y="305" fill="#E2E8F0" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">Chute Lateral Penetrante com Extensão Total de Quadril</text>
</svg>
