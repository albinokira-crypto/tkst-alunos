<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b111e"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="500" height="320" rx="12" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Title Badge -->
  <rect x="20" y="16" width="150" height="26" rx="6" fill="#1E293B" />
  <text x="30" y="34" fill="#FFB703" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold">後屈立ち • KOKUTSU</text>

  <!-- Floor Grid Lines -->
  <line x1="40" y1="260" x2="460" y2="260" stroke="#334155" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Feet Alignment on the Same Line -->
  <!-- Front Foot (Light on ball/heel, straight) -->
  <g transform="translate(150, 245)">
    <rect x="-12" y="-26" width="24" height="48" rx="10" fill="#3B82F6" opacity="0.8" stroke="#60A5FA" stroke-width="1.5"/>
    <text x="0" y="3" fill="#FFF" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">30%</text>
    <text x="0" y="-35" fill="#93C5FD" font-size="9" font-family="sans-serif" text-anchor="middle">Pé Frente (Reto)</text>
  </g>

  <!-- Rear Foot (Turned 90° outward, heels aligned) -->
  <g transform="translate(330, 245) rotate(90)">
    <rect x="-14" y="-28" width="28" height="54" rx="12" fill="#EF4444" opacity="0.9" stroke="#F87171" stroke-width="1.5"/>
    <text x="0" y="3" fill="#FFF" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle" transform="rotate(-90)">70%</text>
  </g>
  <text x="340" y="215" fill="#FCA5A5" font-size="9" font-family="sans-serif">Pé Trás (90° fora)</text>

  <!-- Calcanhares alinhados guide -->
  <line x1="150" y1="245" x2="330" y2="245" stroke="#EAB308" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="240" y="240" fill="#EAB308" font-size="9" font-family="sans-serif" text-anchor="middle">Calcanhares na mesma linha</text>

  <!-- Karateka in Kokutsu Dachi -->
  <!-- Head (Over back hip) -->
  <circle cx="285" cy="85" r="18" fill="#F1F5F9" stroke="#FFB703" stroke-width="2"/>
  <circle cx="279" cy="82" r="3" fill="#0F172A"/> <!-- Eye looking left/front -->

  <!-- Torso & Tanden (Shifted 70% back) -->
  <line x1="285" y1="103" x2="280" y2="175" stroke="#F1F5F9" stroke-width="6" stroke-linecap="round"/>
  <circle cx="280" cy="165" r="7" fill="#EF4444" filter="url(#glow)"/>
  <text x="295" y="169" fill="#F87171" font-size="10" font-weight="bold" font-family="sans-serif">Peso 70% Trás</text>

  <!-- Front Leg (Soft bend, light) -->
  <polyline points="280,175 210,210 150,250" fill="none" stroke="#60A5FA" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Rear Leg (Deeply bent knee over ankle) -->
  <polyline points="280,175 325,205 330,250" fill="none" stroke="#F87171" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="325" cy="205" r="6" fill="#EF4444"/>
  <text x="340" y="195" fill="#FCA5A5" font-size="9" font-family="sans-serif">Joelho para fora</text>

  <!-- Shuto Uke Arms in Kokutsu Dachi -->
  <polyline points="285,120 220,135 170,125" fill="none" stroke="#FFB703" stroke-width="5" stroke-linecap="round"/>
  <polyline points="285,120 250,145 240,150" fill="none" stroke="#F1F5F9" stroke-width="5" stroke-linecap="round"/>

  <!-- Distance Measurement -->
  <line x1="150" y1="295" x2="330" y2="295" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="150" y1="290" x2="150" y2="300" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="330" y1="290" x2="330" y2="300" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="240" y="310" fill="#E2E8F0" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">Base Recuada Defensiva</text>
</svg>
