<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="gradMain_faixa-amarela" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5BE00" />
      <stop offset="100%" stop-color="#C69500" />
    </linearGradient>
    <linearGradient id="gradKnot_faixa-amarela" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5BE00" />
      <stop offset="50%" stop-color="#C69500" />
      <stop offset="100%" stop-color="#8C6800" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.65" />
    </filter>
  </defs>

  <g filter="url(#dropShadow)">
    <!-- Back Loop of Belt -->
    <path d="M 35,95 C 35,50 205,50 205,95 C 205,108 185,115 120,115 C 55,115 35,108 35,95 Z" 
          fill="url(#gradMain_faixa-amarela)" stroke="#8C6800" stroke-width="2.5" />
    
    <!-- Inner Loop Shadow/Folds -->
    <path d="M 50,92 C 75,70 165,70 190,92" 
          fill="none" stroke="#8C6800" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6" />

    <!-- Left Hanging End -->
    <path d="M 105,120 L 75,215 L 105,222 L 122,125 Z" 
          fill="url(#gradMain_faixa-amarela)" stroke="#8C6800" stroke-width="2.5" />
    <!-- Left End Stitching lines -->
    <line x1="84" y1="205" x2="110" y2="130" stroke="#8C6800" stroke-width="1" opacity="0.5" />
    <line x1="94" y1="212" x2="118" y2="128" stroke="#8C6800" stroke-width="1" opacity="0.5" />

    <!-- Right Hanging End (with Karate Patch / Stripes) -->
    <path d="M 118,125 L 140,222 L 170,215 L 135,120 Z" 
          fill="url(#gradMain_faixa-amarela)" stroke="#8C6800" stroke-width="2.5" />
    <!-- Right End Stitching lines -->
    <line x1="145" y1="210" x2="128" y2="130" stroke="#8C6800" stroke-width="1" opacity="0.5" />
    <line x1="155" y1="205" x2="134" y2="128" stroke="#8C6800" stroke-width="1" opacity="0.5" />

    

    <!-- Center Knot (Koma-musubi) -->
    <path d="M 98,105 C 98,98 142,98 142,105 C 146,120 144,134 138,138 C 128,142 112,142 102,138 C 96,134 94,120 98,105 Z" 
          fill="url(#gradKnot_faixa-amarela)" stroke="#8C6800" stroke-width="3" />
    
    <!-- Knot Cross Fold Detail -->
    <path d="M 102,108 C 112,118 128,124 138,134" 
          fill="none" stroke="#F5BE00" stroke-width="2" opacity="0.7" />
    <path d="M 138,108 C 128,118 112,124 102,134" 
          fill="none" stroke="#8C6800" stroke-width="2" opacity="0.6" />
  </g>
</svg>